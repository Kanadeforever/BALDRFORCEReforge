; BaldrForceGamepad v0.1-test7
; 当前版本只保留一个需要用户调整的参数：右摇杆鼠标灵敏度。
;
; 战斗移动：
; - D-Pad / 数字小键盘 8246：保留原版 PC 语义，单按/保持=步行，双击同方向并保持第二下=跑步。
; - 数字小键盘 7913：保留原版斜向。
; - 左摇杆 / 键盘方向键：直接进入原版跑步。
;
; 战斗外：
; - D-Pad 与左摇杆都可用于原版菜单/界面方向操作。
;
; 手柄专用键：
; - START：固定等价键盘 Esc；同时进入统一输入与原生 DIK_ESCAPE 查询。
; - LT：只做鼠标右键。
; - RT：只做鼠标左键。
; - 右摇杆：控制鼠标。
;
; 已删除功能：
; - 不再提供任何鼠标光标自动隐藏。
; - 不再提供“方向右打开剧情快捷菜单/完整菜单”。Right 完全交还游戏原版。

[Mouse]
; 右摇杆控制鼠标的速度倍率。
; 1.00 = 默认速度；0.50 = 一半；2.00 = 两倍。
; 插件内部会把有效范围限制在 0.10 ~ 5.00。
Sensitivity=1.00
